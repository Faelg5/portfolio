<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio — Raphaël Tuor</title>

  <link rel="alternate" hreflang="en" href="/portfolio-en.html">
  <link rel="alternate" hreflang="de" href="/portfolio-de.html">

  <style>
    body {
      margin: 0
    }

    main.wrap {
      max-width: 1100px;
      padding: 16px;
      margin: 0 auto;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .muted {
      color: #e6f1ffbb;
    }

    .btn {
      appearance: none;
      border: 1px solid #ffffff33;
      color: #e6f1ff;
      background: #0b1f33;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none
    }

    .btn.primary {
      background: #0f5;
      color: #012
    }

    .btn.linkish {
      background: transparent;
      border-color: transparent;
      text-decoration: underline
    }

    .badge {
      border: 1px solid #ffffff33;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      opacity: .8
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px
    }

    .card {
      background: #0b2237;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      overflow: hidden
    }

    .card .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #ffffff22;
      color: #e6f1ff
    }

    .card .body {
      padding: 10px 12px;
      color: #cfe2ff
    }

    .card .actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #ffffff22
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero .emoji {
      font-size: 22px
    }

    header.wrap {
      padding: 16px;
      margin: 0 auto;
      max-width: 1100px;
    }

    header.wrap h1 {
      margin: 0;
      color: #e6f1ff;
      font: 600 28px/1.2 system-ui, Segoe UI, Roboto, Arial
    }

    header.wrap p {
      margin: 6px 0 0;
      color: #cfe2ff
    }

    body {
      background: radial-gradient(1200px 600px at 50% -10%, #0b3b66 0, transparent 60%), #051726;
      color: #e6f1ff;
      font: 16px/1.45 system-ui, Segoe UI, Roboto, Arial
    }

    a {
      color: #90e0ff
    }

    .p-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px
    }

    /* Preview-Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .55);
      padding: 18px
    }

    .overlay.show {
      display: flex;
    }

    .pf-panel {
      position: relative;
      background: #0b2237;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      width: min(1100px, 100%);
      height: min(80vh, 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .pf-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #ffffff22;
      color: #fff
    }

    .pf-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block
    }

    /* Spielkarten */
    .game-card {
      background: #0b2237;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      margin: 28px 0;
      padding: 14px
    }

    .game-card h2 {
      font: 600 24px/1.3 system-ui, Segoe UI, Roboto, Arial;
      margin: 0 0 4px
    }

    .game-wrap {
      position: relative;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      overflow: hidden
    }

    .game-cover {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #04121f
    }

    .game-root {
      min-height: 54vh;
      outline: none;
    }
  </style>

  <link rel="preload" href="/style.css" as="style" />
  <link rel="stylesheet" href="/style.css" />
  <script defer src="/assets/js/nav.js"></script>
  <script defer src="/assets/js/feedback.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

          <li><a href="/portfolio-de.html" class="btn" aria-current="page">DE</a></li>
        </ul>
      </nav>
    </header>
  </noscript>

  <header class="wrap">
    <h1>Portfolio — Raphaël Tuor</h1>
    <p class="muted">Auswahl an Web-Projekten (Bildung, KI, Lernspiele). Vorschaubilder öffnen die Seite in einem
      Overlay, sofern das Ziel Einbettungen erlaubt.</p>
  </header>

  <main class="wrap">
    <section id="sites">
      <div id="portfolioGrid" class="p-grid"></div>
    </section>

    <div id="pfOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
      <div class="pf-panel">
        <header class="pf-head">
          <strong id="pfTitle">Vorschau</strong>
          <button id="pfClose" class="btn">Schließen</button>
        </header>
        <div class="pf-frame">
          <iframe id="pfFrame" title="Vorschau" sandbox="allow-scripts allow-popups allow-same-origin"></iframe>
        </div>
        <div id="pfMsg" class="muted" style="display:none;padding:8px 12px">
          Diese Website blockiert eingebettete Vorschauen. ➜ Bitte „Besuchen“ verwenden.
        </div>
      </div>
    </div>

  </main>

  <footer class="wrap" style="margin:24px 0 40px;opacity:.8">
    © Raphaël Tuor — Portfolio
  </footer>

  <script src="/portfolio-data.js"></script>
  <script src="/portfolio.js" defer></script>

</body>
